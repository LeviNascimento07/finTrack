spring:
  datasource:
    url: jdbc:sqlite:file:fintrack-test?mode=memory&cache=shared&foreign_keys=on
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

fintrack:
  jwt:
    secret: segredo-de-teste-com-32-caracteres-ou-mais-apenas-para-testes
    expiration-ms: 86400000

springdoc:
  swagger-ui:
    path: /swagger-ui.html
